spring.application.name=sportms
server.port=${PORT:8080}

# PostgreSQL
# Defaults target a local server; override with environment variables, e.g. for a hosted
# database (Neon etc.): DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sport_ms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (HMAC-SHA256 requires at least 256 bits = 32 bytes)
# Never commit a real secret: supplied via the JWT_SECRET environment variable
# (start-backend.ps1 generates one into the git-ignored .env file on first run).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS
# Deployed frontend origin(s), comma-separated. Local http://localhost:* is always allowed.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:https://sport-management-system-frontend.vercel.app}

