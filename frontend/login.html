<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sport Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Wayamba Sports</h1>
        <p>Log in to reserve courts and grounds</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="userId">Username (Student/Lecturer ID or admin)</label>
          <input type="text" id="userId" class="form-control" placeholder="Enter your ID" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            Remember username
          </label>
          <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--secondary); text-decoration: none;">Forgotten Your Password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%;">Log In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
