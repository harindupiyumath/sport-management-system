<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Wayamba Sports</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Change Password</h1>
        <p id="changeIntro">Choose a new password for your account</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="changePasswordForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          <span class="form-hint">Minimum 8 characters including capital and simple letters, number and symbol.</span>
          <span id="passwordFeedback" class="form-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          <span id="confirmFeedback" class="form-error"></span>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Change Password</button>
      </form>

      <div class="auth-footer">
        <a href="#" id="backLink">Back</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/change-password.js"></script>
</body>
</html>
