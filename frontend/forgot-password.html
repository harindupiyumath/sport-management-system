<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Sport Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Set a new password for your account</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="userId">Username (ID)</label>
          <input type="text" id="userId" class="form-control" placeholder="Enter your ID" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
          <span class="form-hint">Minimum 8 characters including capital and simple letters, number and symbol.</span>
          <span id="passwordFeedback" class="form-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
          <span id="confirmFeedback" class="form-error"></span>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Reset Password</button>
      </form>

      <div class="auth-footer">
        Back to <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
