# Render Blueprint: deploys the Spring Boot backend from this repo.
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: sport-management-system-api
    runtime: docker
    plan: free
    region: virginia            # same AWS region as the Neon database (us-east)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      # Neon Postgres (direct / unpooled endpoint; the app keeps its own HikariCP pool)
      - key: DB_URL
        sync: false             # Render asks for the value when the Blueprint is created
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # JWT signing key, generated by Render (never stored in git)
      - key: JWT_SECRET
        generateValue: true
      # Browser origins allowed to call the API (comma-separated)
      - key: CORS_ALLOWED_ORIGINS
        value: https://sport-management-system-frontend.vercel.app
